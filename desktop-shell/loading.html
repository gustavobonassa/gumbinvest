<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GumbInvest</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center;
         background: #0b1210; color: #e6efe9; font-family: system-ui, sans-serif; }
  .titlebar { position: fixed; inset: 0 0 auto 0; height: 36px; background: #10151c;
              border-bottom: 1px solid #1d2633; -webkit-app-region: drag;
              display: flex; align-items: center; padding: 0 12px;
              font-size: 12px; color: #8aa79a; }
  main { text-align: center; }
  .spin { width: 44px; height: 44px; margin: 0 auto 20px; border: 3px solid #1e3a2f;
          border-top-color: #34d399; border-radius: 50%; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  p { color: #8aa79a; font-size: 14px; max-width: 420px; }
</style>
</head>
<body>
  <div class="titlebar">GumbInvest</div>
  <main>
    <div class="spin"></div>
    <h1>GumbInvest</h1>
    <p>Iniciando o servidor local, o painel abre sozinho em instantes.
       Cotações e câmbios continuam sendo baixados em segundo plano.</p>
  </main>
</body>
</html>
