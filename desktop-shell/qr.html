<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Abrir no celular</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0b1210; color: #e6efe9; font-family: system-ui, sans-serif; }
  main { text-align: center; padding: 16px; }
  img { border-radius: 12px; background: white; padding: 8px; }
  .url { margin-top: 12px; font-size: 15px; color: #34d399; font-weight: 600; }
  p { color: #8aa79a; font-size: 12.5px; max-width: 300px; margin: 10px auto 0; }
</style>
</head>
<body>
  <main>
    <img id="qr" width="280" height="280" alt="QR code">
    <div class="url" id="url"></div>
    <p>Aponte a câmera do celular (na mesma rede Wi-Fi). Se não conectar,
       permita o GumbInvest no aviso do Firewall do Windows (redes privadas).</p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("qr").src = params.get("qr");
    document.getElementById("url").textContent = params.get("url");
  </script>
</body>
</html>
